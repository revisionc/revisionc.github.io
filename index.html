<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RevisionC</title>
  <meta name="description" content="RevisionC: games, mods and tools. Projects coming soon.">
  <style>
    :root {
      --bg: #f4f2ec;
      --ink: #1c1d1f;
      --muted: #6b6c70;
      --line: #c9c5b9;
      --accent: #2f6f5e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141517;
        --ink: #e8e6e0;
        --muted: #9a9890;
        --line: #34353a;
        --accent: #6fbfa6;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--line);
      padding: 40px 32px 28px;
    }
    .rev {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(36px, 9vw, 52px);
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      line-height: 1;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
    footer {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 13px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="rev"><span>Drawing No. RC-001</span><span>Rev C</span></div>
    <h1>Revision<span>C</span></h1>
    <p>Games, mods and tools. Projects are being prepared for release and will appear here soon.</p>
    <footer><a href="https://github.com/revisionc">github.com/revisionc</a></footer>
  </main>
</body>
</html>
